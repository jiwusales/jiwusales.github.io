<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>吉物短網址</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f8f7;font:16px system-ui;color:#35473c}main{text-align:center;padding:32px}a,button{color:inherit;font:inherit}button{border:1px solid #ccc;border-radius:8px;background:white;padding:8px 16px;cursor:pointer}p{line-height:1.7}</style></head><body><main><h1>JIWU 吉物</h1><p id="message" role="status">正在開啟商品頁…</p><button id="retry" hidden>重試</button><p><a href="https://jiwusales.github.io/jiwu_menu/">前往吉物首頁</a></p></main><script>
async function openLink(){const message=document.getElementById('message'),retry=document.getElementById('retry'),code=location.hash.slice(1)||new URL(location.href).searchParams.get('code')||'';retry.hidden=true;if(!/^[a-f0-9]{6,8}$/.test(code)){message.textContent=code?'短網址格式不正確':'開啟吉物短網址，即可直接前往商品頁。';return;}message.textContent='正在開啟商品頁…';try{const response=await fetch('https://rilompdypgjzhynqjlwv.supabase.co/functions/v1/jiwu-short-links?code='+encodeURIComponent(code),{signal:AbortSignal.timeout(15000)}),data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'無法開啟連結');const target=new URL(data.url);if(target.origin!=='https://jiwusales.github.io'||target.pathname!=='/jiwu_menu/NEWGOODS.html')throw Error('連結無效');location.replace(target.href);}catch(error){message.textContent=error.name==='TimeoutError'?'連線逾時，請重試':error.message;retry.hidden=false;}}
document.getElementById('retry').addEventListener('click',openLink);window.addEventListener('hashchange',openLink);openLink();
</script></body></html>
